{% extends "admin/base.html" %}
{% load static %}

{% block title %}
MindTree Admin | {{ site_title|default:_("Django site admin") }}
{% endblock %}

{% block branding %}

<div style="
    display:flex;
    align-items:center;
    gap:15px;
    min-height:58px;
">

    <img
        src="{% static 'images/logo.png' %}"
        alt="MindTree Technology Solution"
        style="
            height:52px;
            width:auto;
            max-width:260px;
            object-fit:contain;
            background:#ffffff;
            padding:4px 8px;
            border-radius:4px;
        "
    >

    <div style="line-height:1.3;">

        <div style="
            font-size:20px;
            font-weight:700;
        ">
            MindTree Website Administration
        </div>

        <div style="
            font-size:12px;
            opacity:0.8;
            margin-top:3px;
        ">
            Website Management Console
        </div>

    </div>

</div>

{% endblock %}


{% block nav-global %}
{% endblock %}
